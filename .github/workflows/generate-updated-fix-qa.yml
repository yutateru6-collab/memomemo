name: Generate updated legacy QA copy

on:
  push:
    branches:
      - fix/remove-welcome-sample-20260906

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate QA copy
        run: python3 scripts/generate_updated_fix_qa.py
      - name: Commit generated copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/fix-and-qa.yml
          git commit -m "Generate legacy QA update"
          git push origin HEAD:${GITHUB_REF_NAME}
