name: Mobile Complete UX Audit

on:
  push:
    branches:
      - main
      - qa/visual-mobile-screenshots-20260905
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mobile-complete-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start app
        run: |
          bun run dev > /tmp/memomemo-complete-mobile.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/memomemo-complete-mobile.log
          exit 1

      - name: Audit and capture every important mobile screen
        run: |
          mkdir -p complete-mobile-artifacts
          cat > complete-mobile-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const browser = await chromium.launch({ headless: true });
          const cases = [
            { name: 'iphone-se', width: 375, height: 667, top: 47, bottom: 20, left: 0, right: 0 },
            { name: 'iphone-15', width: 390, height: 844, top: 59, bottom: 34, left: 0, right: 0 },
            { name: 'iphone-max', width: 430, height: 932, top: 59, bottom: 34, left: 0, right: 0 },
            { name: 'iphone-landscape', width: 844, height: 390, top: 0, bottom: 21, left: 59, right: 59 },
          ];
          const failures = [];
          const visualManifest = [];
          const addFailure = (caseName, message) => failures.push(`${caseName}: ${message}`);
          const png1x1 = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2n8sAAAAASUVORK5CYII=', 'base64');

          async function makePage(c) {
            const context = await browser.newContext({
              viewport: { width: c.width, height: c.height },
              screen: { width: c.width, height: c.height },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1',
            });
            const page = await context.newPage();

            // Local Vite has no Cloudflare Worker route. Mock only that local endpoint so
            // visual evidence does not show a fake red sync error after a successful save.
            await page.route('**/api/sync', async route => {
              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ success: true, entries: [] }),
              });
            });

            await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' });
            await page.waitForSelector('#note-list-container');
            await page.addStyleTag({
              content: `:root{--safe-area-top:${c.top}px !important;--safe-area-bottom:${c.bottom}px !important;--safe-area-left:${c.left}px !important;--safe-area-right:${c.right}px !important;}`,
            });
            return { context, page };
          }

          async function setTheme(page, mode) {
            const wantDark = mode === 'dark';
            let isDark = await page.evaluate(() => document.documentElement.classList.contains('dark'));
            if (isDark !== wantDark) {
              await page.click('#theme-toggle-btn');
              await page.waitForFunction(
                (dark) => document.documentElement.classList.contains('dark') === dark,
                wantDark
              );
              isDark = await page.evaluate(() => document.documentElement.classList.contains('dark'));
            }
            if (isDark !== wantDark) throw new Error(`Could not force ${mode} mode`);
          }

          async function rect(page, selector) {
            return page.locator(selector).evaluate((el) => {
              const r = el.getBoundingClientRect();
              return { x:r.x, y:r.y, width:r.width, height:r.height, right:r.right, bottom:r.bottom };
            });
          }

          async function snap(page, c, stage) {
            const dir = path.join('complete-mobile-artifacts', c.name);
            fs.mkdirSync(dir, { recursive: true });
            const file = path.join(dir, `${stage}.png`);
            await page.screenshot({ path: file, fullPage: false, animations: 'disabled' });
            visualManifest.push({
              device: c.name,
              stage,
              file,
              viewport: `${c.width}x${c.height}`,
              simulatedSafeArea: { top:c.top, right:c.right, bottom:c.bottom, left:c.left },
            });
          }

          async function assertTouch(page, c, selector, label) {
            if (!(await page.locator(selector).count())) {
              addFailure(c.name, `${label} is missing`);
              return;
            }
            const r = await rect(page, selector);
            if (r.height < 44) addFailure(c.name, `${label} is only ${r.height.toFixed(1)}px high`);
            if (r.width < 44) addFailure(c.name, `${label} is only ${r.width.toFixed(1)}px wide`);
          }

          for (const c of cases) {
            // ---------- LIGHT MODE: full numeric + visual audit ----------
            const { context, page } = await makePage(c);
            await setTheme(page, 'light');

            await snap(page, c, '01-light-home-top');
            const homeTitle = await page.getByRole('heading', { name: 'メモ', exact: true }).boundingBox();
            if (!homeTitle) addFailure(c.name, 'home title missing');
            if (homeTitle && homeTitle.y < c.top) addFailure(c.name, `home title enters status-bar safe area: y=${homeTitle.y.toFixed(1)}, safeTop=${c.top}`);

            const bodyMetrics = await page.evaluate(() => ({ sw: document.documentElement.scrollWidth, iw: innerWidth }));
            if (bodyMetrics.sw > bodyMetrics.iw + 1) addFailure(c.name, `home horizontal overflow ${bodyMetrics.sw}px > ${bodyMetrics.iw}px`);

            for (const [selector, label] of [
              ['#reminders-header-btn','reminder header button'],
              ['#cloudflare-header-btn','cloud header button'],
              ['#theme-toggle-btn','theme button'],
              ['#create-new-note-bottom-btn','new memo button'],
              ['#notes-search-input','search field'],
              ['#filter-tag-all','all filter'],
              ['#filter-pending-tasks','pending filter'],
              ['#filter-has-attachments','attachment filter'],
            ]) await assertTouch(page, c, selector, label);

            const createRect = await rect(page, '#create-new-note-bottom-btn');
            const searchRect = await rect(page, '#notes-search-input');
            if (createRect.y > searchRect.y) addFailure(c.name, 'new memo action is not above search');
            if (createRect.x < c.left) addFailure(c.name, `new memo action enters left safe area: x=${createRect.x}`);
            if (createRect.right > c.width - c.right + 0.5) addFailure(c.name, `new memo action enters right safe area: right=${createRect.right}`);

            if (c.name === 'iphone-landscape') {
              const desktopToggleVisible = await page.locator('#toggle-iphone-frame-btn').isVisible().catch(() => false);
              if (desktopToggleVisible) addFailure(c.name, 'desktop frame controls are visible on an iPhone in landscape');
            }

            const listScroller = page.locator('#note-list-container .overflow-y-auto').last();
            if (await listScroller.count()) {
              await listScroller.evaluate((el) => { el.scrollTop = el.scrollHeight; });
              await page.waitForTimeout(100);
              await snap(page, c, '02-light-home-bottom');
              await listScroller.evaluate((el) => { el.scrollTop = 0; });
            } else {
              addFailure(c.name, 'home note list scroller missing');
              await snap(page, c, '02-light-home-bottom');
            }

            await page.click('#cloudflare-header-btn');
            await page.waitForSelector('#cloudflare-modal-content');
            const cloudRect = await rect(page, '#cloudflare-modal-content');
            if (cloudRect.y < c.top) addFailure(c.name, `cloud modal enters top safe area: y=${cloudRect.y}`);
            if (cloudRect.bottom > c.height - c.bottom + 0.5) addFailure(c.name, `cloud modal enters bottom safe area: bottom=${cloudRect.bottom}`);
            await assertTouch(page, c, '#close-cloudflare-modal-btn', 'cloud modal close');
            await snap(page, c, '03-light-cloudflare-modal');
            await page.click('#close-cloudflare-modal-btn');

            await page.click('#reminders-header-btn');
            await page.waitForSelector('#reminders-modal-content');
            const reminderRect = await rect(page, '#reminders-modal-content');
            if (reminderRect.y < c.top) addFailure(c.name, `reminder modal enters top safe area: y=${reminderRect.y}`);
            if (reminderRect.bottom > c.height - c.bottom + 0.5) addFailure(c.name, `reminder modal enters bottom safe area: bottom=${reminderRect.bottom}`);
            await assertTouch(page, c, '#close-reminders-modal-btn', 'reminder modal close');
            await snap(page, c, '04-light-reminders-modal');
            await page.click('#close-reminders-modal-btn');

            await page.click('#create-new-note-bottom-btn');
            await page.waitForSelector('#note-editor-container');
            if (c.name === 'iphone-landscape' && await page.locator('#note-list-container').count()) {
              addFailure(c.name, 'landscape iPhone still shows split-view note list while editing');
            }
            await page.fill('#note-title-input', `VISUAL QA ${c.name}`);
            await page.fill('#note-content-textarea', 'スマホ実画面の目視確認用メモです。\n上部・入力欄・保存導線・ToDo・添付表示を確認します。');
            const editorBack = await rect(page, '#editor-back-btn');
            if (editorBack.y < c.top) addFailure(c.name, `editor back button enters top safe area: y=${editorBack.y}`);
            for (const [selector, label] of [
              ['#editor-back-btn','editor back'], ['#editor-save-btn','editor save'], ['#editor-more-btn','editor more'],
              ['#mode-edit-btn','edit mode'], ['#mode-preview-btn','preview mode'], ['#new-task-text-input','new task field'], ['#add-task-btn','add task'],
            ]) await assertTouch(page, c, selector, label);
            const editorMetrics = await page.evaluate(() => ({ sw: document.documentElement.scrollWidth, iw: innerWidth }));
            if (editorMetrics.sw > editorMetrics.iw + 1) addFailure(c.name, `editor horizontal overflow ${editorMetrics.sw}px > ${editorMetrics.iw}px`);
            await snap(page, c, '05-light-editor-top');

            await page.click('#editor-save-btn');
            await page.waitForTimeout(250);
            await snap(page, c, '06-light-editor-saved');

            await page.fill('#new-task-text-input', '明日やることを確認');
            await page.click('#add-task-btn');
            const unsafeTaskX = page.locator('button[aria-label="タスクを削除"], button[title="タスクを削除"]');
            if (await unsafeTaskX.count()) addFailure(c.name, 'task still exposes a direct one-tap delete button');
            const taskMore = page.locator('[data-testid="task-more-btn"]').first();
            if (!(await taskMore.count())) addFailure(c.name, 'task More button missing');
            else {
              const tr = await taskMore.evaluate((el) => { const r=el.getBoundingClientRect(); return {width:r.width,height:r.height}; });
              if (tr.width < 44 || tr.height < 44) addFailure(c.name, `task More target is ${tr.width}x${tr.height}`);
            }
            await snap(page, c, '07-light-editor-todo');

            if (await taskMore.count()) {
              await taskMore.click();
              await page.waitForTimeout(100);
              await snap(page, c, '08-light-task-more-menu');
              await taskMore.click();
            } else {
              await snap(page, c, '08-light-task-more-menu');
            }

            await page.click('#editor-more-btn');
            await page.waitForSelector('#editor-more-menu');
            await snap(page, c, '09-light-editor-more-menu');
            await page.click('#editor-more-btn');

            await page.click('#mode-preview-btn');
            await page.waitForSelector('#note-markdown-rendered-view');
            await snap(page, c, '10-light-preview');
            await page.click('#mode-edit-btn');

            const fileInput = page.locator('input[type="file"][multiple]');
            await fileInput.setInputFiles({ name:'qa-safe.png', mimeType:'image/png', buffer:png1x1 });
            await page.waitForTimeout(250);
            await snap(page, c, '11-light-editor-attachment');
            await page.locator('[title="拡大表示 / 開く"]').first().click();
            await page.waitForSelector('#attachment-lightbox-overlay');
            await assertTouch(page, c, '#attachment-close-btn', 'attachment close');
            await assertTouch(page, c, '#attachment-download-btn', 'attachment save');
            const attachmentClose = await rect(page, '#attachment-close-btn');
            if (attachmentClose.y < c.top) addFailure(c.name, `attachment controls enter top safe area: y=${attachmentClose.y}`);
            await snap(page, c, '12-light-attachment-viewer');
            await context.close();

            // ---------- DARK MODE: visual review of the screens the user actually uses ----------
            const { context: darkContext, page: darkPage } = await makePage(c);
            await setTheme(darkPage, 'dark');
            await snap(darkPage, c, '13-dark-home-top');

            await darkPage.click('#cloudflare-header-btn');
            await darkPage.waitForSelector('#cloudflare-modal-content');
            await snap(darkPage, c, '14-dark-cloudflare-modal');
            await darkPage.click('#close-cloudflare-modal-btn');

            await darkPage.click('#reminders-header-btn');
            await darkPage.waitForSelector('#reminders-modal-content');
            await snap(darkPage, c, '15-dark-reminders-modal');
            await darkPage.click('#close-reminders-modal-btn');

            await darkPage.click('#create-new-note-bottom-btn');
            await darkPage.waitForSelector('#note-editor-container');
            await darkPage.fill('#note-title-input', `DARK VISUAL QA ${c.name}`);
            await darkPage.fill('#note-content-textarea', 'ダークモードのスマホ表示を目視確認しています。');
            await darkPage.fill('#new-task-text-input', 'ダークモードのToDo');
            await darkPage.click('#add-task-btn');
            await snap(darkPage, c, '16-dark-editor-todo');

            await darkPage.click('#editor-more-btn');
            await darkPage.waitForSelector('#editor-more-menu');
            await snap(darkPage, c, '17-dark-editor-more-menu');
            await darkPage.click('#editor-more-btn');

            const darkFileInput = darkPage.locator('input[type="file"][multiple]');
            await darkFileInput.setInputFiles({ name:'qa-dark.png', mimeType:'image/png', buffer:png1x1 });
            await darkPage.waitForTimeout(250);
            await darkPage.locator('[title="拡大表示 / 開く"]').first().click();
            await darkPage.waitForSelector('#attachment-lightbox-overlay');
            await snap(darkPage, c, '18-dark-attachment-viewer');
            await darkContext.close();
          }

          fs.writeFileSync('complete-mobile-artifacts/findings.json', JSON.stringify({ failureCount: failures.length, failures }, null, 2));
          fs.writeFileSync('complete-mobile-artifacts/visual-manifest.json', JSON.stringify(visualManifest, null, 2));
          console.log(JSON.stringify({ failureCount: failures.length, failures, screenshotCount: visualManifest.length }, null, 2));
          await browser.close();
          if (failures.length) process.exit(1);
          EOF
          node complete-mobile-audit.mjs

      - name: Verify visual evidence is complete
        if: always()
        run: |
          test -f complete-mobile-artifacts/findings.json
          test -f complete-mobile-artifacts/visual-manifest.json
          for device in iphone-se iphone-15 iphone-max iphone-landscape; do
            for stage in \
              01-light-home-top \
              02-light-home-bottom \
              03-light-cloudflare-modal \
              04-light-reminders-modal \
              05-light-editor-top \
              06-light-editor-saved \
              07-light-editor-todo \
              08-light-task-more-menu \
              09-light-editor-more-menu \
              10-light-preview \
              11-light-editor-attachment \
              12-light-attachment-viewer \
              13-dark-home-top \
              14-dark-cloudflare-modal \
              15-dark-reminders-modal \
              16-dark-editor-todo \
              17-dark-editor-more-menu \
              18-dark-attachment-viewer; do
              test -f "complete-mobile-artifacts/${device}/${stage}.png"
            done
          done
          count=$(find complete-mobile-artifacts -name '*.png' | wc -l | tr -d ' ')
          test "$count" = "72"
          echo "72 mobile screenshots captured successfully."

      - name: Upload complete mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-complete-ux-audit
          path: complete-mobile-artifacts/
