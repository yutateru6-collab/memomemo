name: Update mobile UX QA wiring

on:
  push:
    branches:
      - fix/mobile-human-ux-20260905

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update regression QA for new More menu and main coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_qa = Path('.github/workflows/fix-and-qa.yml')
          s = old_qa.read_text()
          old = """            await page.waitForSelector('#note-editor-container');
            await page.click('#editor-reminder-btn');
            const dueInput = page.locator('#note-editor-container input[type=\"datetime-local\"]').first();"""
          new = """            await page.waitForSelector('#note-editor-container');
            await page.click('#editor-more-btn');
            await page.waitForSelector('#editor-more-menu');
            await page.click('#editor-reminder-btn');
            const dueInput = page.locator('#note-editor-container input[type=\"datetime-local\"]').first();"""
          if old not in s:
              raise SystemExit('Legacy reminder QA snippet not found; refusing broad edit')
          old_qa.write_text(s.replace(old, new, 1))

          mobile_qa = Path('.github/workflows/mobile-ux-regression.yml')
          s = mobile_qa.read_text()
          old = """  push:
    branches:
      - fix/mobile-human-ux-20260905"""
          new = """  push:
    branches:
      - main
      - fix/mobile-human-ux-20260905"""
          if old not in s:
              raise SystemExit('Mobile QA trigger snippet not found; refusing broad edit')
          mobile_qa.write_text(s.replace(old, new, 1))
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/update-mobile-ux-qa.yml

      - name: Commit QA update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update regression QA for mobile More menu"
          git push origin HEAD:${GITHUB_REF_NAME}
