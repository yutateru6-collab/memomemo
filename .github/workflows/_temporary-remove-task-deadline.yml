name: Temporary Remove Task Deadline

on:
  push:
    branches:
      - fix/remove-task-deadline-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-task-deadline-20260908
          fetch-depth: 0
      - name: Patch source
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/remove-task-deadline.py
          python /tmp/remove-task-deadline.py
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/NoteEditor.tsx src/App.tsx src/components/CalendarView.tsx src/components/RemindersModal.tsx src/services/notifications.ts
          git commit -m "fix: remove task deadline and calendar controls"
          git push origin HEAD:fix/remove-task-deadline-20260908
