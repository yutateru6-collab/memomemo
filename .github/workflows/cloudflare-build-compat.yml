name: Cloudflare Build Compatibility

on:
  push:
    branches:
      - 'chore/cloudflare-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Cloudflare Bun version
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Repair lockfile for Cloudflare Bun on setup branch
        if: github.event_name == 'push'
        run: |
          if bun install --frozen-lockfile; then
            echo "bun.lock is already compatible with Bun 1.2.15"
          else
            echo "Regenerating bun.lock with Bun 1.2.15"
            rm -f bun.lock
            bun install --lockfile-only
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            if ! git diff --cached --quiet; then
              git commit -m "Regenerate bun.lock for Cloudflare Bun 1.2.15"
              git push origin HEAD:${GITHUB_REF_NAME}
            fi
          fi

      - name: Install dependencies exactly as Cloudflare does
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Validate Worker entry syntax
        run: node --check worker/index.js

      - name: Validate Wrangler configuration and bundle
        run: npx --yes wrangler@latest deploy --dry-run
