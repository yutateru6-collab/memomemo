name: Apply home and task safety patch

on:
  push:
    branches:
      - fix/home-note-list-and-safe-task-delete-20260905

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply source patch
        run: python3 scripts/apply_home_task_safety_patch.py

      - name: Verify source changes
        run: |
          grep -q 'create-new-note-top-btn' src/components/NoteList.tsx
          if grep -q 'create-new-note-bottom-btn' src/components/NoteList.tsx; then exit 1; fi
          grep -q 'data-note-card="true"' src/components/NoteList.tsx
          grep -q 'task-more-btn-' src/components/NoteEditor.tsx
          grep -q 'タスクを削除' src/components/NoteEditor.tsx

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/NoteList.tsx src/components/NoteEditor.tsx
          git commit -m "Move new memo action to top and make task deletion safer"
          git push origin HEAD:${GITHUB_REF_NAME}
