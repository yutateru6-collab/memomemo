name: Apply home and task safety patch

on:
  push:
    branches:
      - fix/home-note-list-and-safe-task-delete-20260905

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch home list and task deletion UX
        run: |
          python3 - <<'PY'
          from pathlib import Path

          note_list = Path('src/components/NoteList.tsx')
          s = note_list.read_text()

          marker = """        {/* iOS Style Search Bar */}"""
          top_button = """        {/* Primary create action stays at the top on phones and desktop. */}
        <div className=\"mb-2\">
          <button
            id=\"create-new-note-top-btn\"
            type=\"button\"
            onClick={onCreateNewNote}
            className=\"w-full min-h-11 flex items-center justify-center gap-2 px-4 py-2.5 bg-amber-500 hover:bg-amber-400 active:bg-amber-300 text-black text-sm font-bold rounded-xl shadow-sm transition-all active:scale-[0.99]\"
          >
            <SquarePen className=\"w-4 h-4\" />
            <span>新規メモ</span>
          </button>
        </div>

        {/* iOS Style Search Bar */}"""
          if 'id="create-new-note-top-btn"' not in s:
              if marker not in s:
                  raise SystemExit('NoteList search marker not found')
              s = s.replace(marker, top_button, 1)

          s = s.replace(
              'className="flex-1 overflow-y-auto px-4 py-2 space-y-4"',
              'className="flex-1 overflow-y-auto px-4 py-2 pb-safe space-y-4"',
              1,
          )

          bottom = """      {/* Bottom iOS Toolbar */}
      <div className=\"py-2.5 px-4 bg-[#f2f2f7]/90 dark:bg-[#1c1c1e]/90 backdrop-blur-md border-t border-neutral-200 dark:border-neutral-800 flex items-center justify-between z-20 pb-safe\">
        <div className=\"text-[11px] text-neutral-500 dark:text-neutral-400 font-medium\">
          {notes.length} 件のメモ
        </div>

        <button
          id=\"create-new-note-bottom-btn\"
          type=\"button\"
          onClick={onCreateNewNote}
          className=\"flex items-center gap-1.5 px-4 py-2 bg-amber-500 hover:bg-amber-400 text-black text-xs font-semibold rounded-full shadow-sm transition-all transform active:scale-95\"
        >
          <SquarePen className=\"w-4 h-4\" />
          <span>新規メモ</span>
        </button>
      </div>
"""
          if bottom in s:
              s = s.replace(bottom, '', 1)

          old_card = """      <div
        key={note.id}
        onClick={() => onSelectNote(note)}"""
          new_card = """      <div
        key={note.id}
        data-note-card=\"true\"
        data-note-id={note.id}
        onClick={() => onSelectNote(note)}"""
          if 'data-note-card="true"' not in s:
              if old_card not in s:
                  raise SystemExit('Note card marker not found')
              s = s.replace(old_card, new_card, 1)

          note_list.write_text(s)

          editor = Path('src/components/NoteEditor.tsx')
          s = editor.read_text()

          state_marker = """  const [showMoreMenu, setShowMoreMenu] = useState(false);
  const [saveState, setSaveState] = useState<'idle' | 'saving' | 'saved' | 'error'>('idle');"""
          state_replacement = """  const [showMoreMenu, setShowMoreMenu] = useState(false);
  const [openTaskMenuId, setOpenTaskMenuId] = useState<string | null>(null);
  const [saveState, setSaveState] = useState<'idle' | 'saving' | 'saved' | 'error'>('idle');"""
          if 'openTaskMenuId' not in s:
              if state_marker not in s:
                  raise SystemExit('Task menu state marker not found')
              s = s.replace(state_marker, state_replacement, 1)

          old_delete = """                    <button
                      type=\"button\"
                      onClick={() => handleDeleteTask(task.id)}
                      className=\"opacity-100 sm:opacity-0 sm:group-hover:opacity-100 min-w-11 min-h-11 inline-flex items-center justify-center text-neutral-400 hover:text-rose-500 transition-opacity\"
                    >
                      <X className=\"w-3.5 h-3.5\" />
                    </button>"""
          new_delete = """                    <div className=\"relative\">
                      <button
                        id={`task-more-btn-${task.id}`}
                        type=\"button\"
                        aria-label={`${task.text} のその他の操作`}
                        aria-expanded={openTaskMenuId === task.id}
                        onClick={() => setOpenTaskMenuId((current) => current === task.id ? null : task.id)}
                        className=\"min-w-11 min-h-11 inline-flex items-center justify-center rounded-xl text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-200 hover:bg-neutral-200/70 dark:hover:bg-neutral-700/70 transition-colors\"
                      >
                        <MoreHorizontal className=\"w-4 h-4\" />
                      </button>

                      {openTaskMenuId === task.id && (
                        <div className=\"absolute right-0 top-full mt-1 z-30 w-44 overflow-hidden rounded-xl border border-neutral-200 dark:border-neutral-700 bg-white dark:bg-neutral-900 shadow-xl\">
                          <button
                            id={`task-delete-btn-${task.id}`}
                            type=\"button\"
                            onClick={() => {
                              if (confirm(`「${task.text}」を削除しますか？`)) {
                                handleDeleteTask(task.id);
                              }
                              setOpenTaskMenuId(null);
                            }}
                            className=\"w-full min-h-11 px-4 flex items-center gap-2 text-left text-sm font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-500/10\"
                          >
                            <Trash2 className=\"w-4 h-4\" />
                            タスクを削除
                          </button>
                        </div>
                      )}
                    </div>"""
          if 'task-more-btn-' not in s:
              if old_delete not in s:
                  raise SystemExit('Immediate task delete button marker not found')
              s = s.replace(old_delete, new_delete, 1)

          editor.write_text(s)
          PY

      - name: Verify source changes
        run: |
          grep -q 'create-new-note-top-btn' src/components/NoteList.tsx
          ! grep -q 'create-new-note-bottom-btn' src/components/NoteList.tsx
          grep -q 'data-note-card="true"' src/components/NoteList.tsx
          grep -q 'task-more-btn-' src/components/NoteEditor.tsx
          grep -q 'タスクを削除' src/components/NoteEditor.tsx

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/NoteList.tsx src/components/NoteEditor.tsx
          git commit -m "Move new memo action to top and make task deletion safer"
          git push origin HEAD:${GITHUB_REF_NAME}
