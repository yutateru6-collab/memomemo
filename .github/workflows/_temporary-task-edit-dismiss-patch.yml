name: Temporary Task Edit and Dismiss Patch

on:
  push:
    branches:
      - fix/task-edit-dismiss-menu-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/task-edit-dismiss-menu-20260908
          fetch-depth: 0

      - name: Patch task menu dismissal and inline task editing
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/task-patch.py
          python /tmp/task-patch.py

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/NoteEditor.tsx .github/workflows/home-task-safety-regression.yml
          git commit -m "feat: edit tasks and dismiss task menu on outside tap"
          git push origin HEAD:fix/task-edit-dismiss-menu-20260908
