name: Temporary Task Edit and Dismiss Patch

on:
  push:
    branches:
      - fix/task-edit-dismiss-menu-20260908

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/task-edit-dismiss-menu-20260908
          fetch-depth: 0

      - name: Patch task menu dismissal and inline task editing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          editor = Path('src/components/NoteEditor.tsx')
          text = editor.read_text()

          text = text.replace(
              "import React, { useState, useRef } from 'react';",
              "import React, { useEffect, useRef, useState } from 'react';",
              1,
          )

          state_anchor = "  const [openTaskMenuId, setOpenTaskMenuId] = useState<string | null>(null);\n"
          state_insert = (
              state_anchor
              + "  const [editingTaskId, setEditingTaskId] = useState<string | null>(null);\n"
              + "  const [editingTaskText, setEditingTaskText] = useState('');\n"
          )
          if "const [editingTaskId" not in text:
              if state_anchor not in text:
                  raise SystemExit('Task state anchor not found')
              text = text.replace(state_anchor, state_insert, 1)

          ref_anchor = "  latestNoteRef.current = note;\n\n"
          effect = """  useEffect(() => {
    if (!openTaskMenuId) return;

    const handlePointerDown = (event: PointerEvent) => {
      const target = event.target;
      if (
        target instanceof Element &&
        target.closest(`[data-task-menu-container=\"${openTaskMenuId}\"]`)
      ) {
        return;
      }
      setOpenTaskMenuId(null);
    };

    document.addEventListener('pointerdown', handlePointerDown);
    return () => document.removeEventListener('pointerdown', handlePointerDown);
  }, [openTaskMenuId]);

"""
          if "document.addEventListener('pointerdown', handlePointerDown)" not in text:
              if ref_anchor not in text:
                  raise SystemExit('Ref anchor not found')
              text = text.replace(ref_anchor, ref_anchor + effect, 1)

          due_anchor = """  // Update Task Due Date
  const handleTaskDueDateChange = (taskId: string, dueDate: string) => {
    onUpdateNote({
      ...note,
      tasks: note.tasks.map((t) =>
        t.id === taskId ? { ...t, dueDate: dueDate || undefined } : t
      ),
      updatedAt: Date.now(),
    });
  };

"""
          edit_handlers = """  // Edit Task Text
  const handleStartTaskEdit = (task: TaskItem) => {
    setOpenTaskMenuId(null);
    setEditingTaskId(task.id);
    setEditingTaskText(task.text);
  };

  const handleCommitTaskEdit = (taskId: string) => {
    const trimmed = editingTaskText.trim();
    const currentTask = note.tasks.find((task) => task.id === taskId);

    if (trimmed && currentTask && currentTask.text !== trimmed) {
      onUpdateNote({
        ...note,
        tasks: note.tasks.map((task) =>
          task.id === taskId ? { ...task, text: trimmed } : task
        ),
        updatedAt: Date.now(),
      });
    }

    setEditingTaskId(null);
    setEditingTaskText('');
  };

"""
          if "const handleStartTaskEdit" not in text:
              if due_anchor not in text:
                  raise SystemExit('Task due date anchor not found')
              text = text.replace(due_anchor, due_anchor + edit_handlers, 1)

          old_text = """                    <span
                      className={`text-xs flex-1 break-words ${
                        task.completed
                          ? 'line-through text-neutral-400 dark:text-neutral-500'
                          : 'text-neutral-800 dark:text-neutral-200 font-medium'
                      }`}
                    >
                      {task.text}
                    </span>
"""
          new_text = """                    {editingTaskId === task.id ? (
                      <input
                        data-testid=\"task-edit-input\"
                        type=\"text\"
                        value={editingTaskText}
                        onChange={(e) => setEditingTaskText(e.target.value)}
                        onBlur={() => handleCommitTaskEdit(task.id)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            e.preventDefault();
                            e.currentTarget.blur();
                          } else if (e.key === 'Escape') {
                            e.preventDefault();
                            setEditingTaskId(null);
                            setEditingTaskText('');
                          }
                        }}
                        aria-label={`${task.text} を編集`}
                        className=\"flex-1 min-w-0 min-h-11 rounded-xl border border-amber-500/70 bg-white dark:bg-neutral-900 px-3 text-base text-neutral-900 dark:text-white outline-none focus:ring-2 focus:ring-amber-500/30\"
                        autoFocus
                      />
                    ) : (
                      <button
                        data-testid=\"task-edit-trigger\"
                        type=\"button\"
                        onClick={() => handleStartTaskEdit(task)}
                        aria-label={`${task.text} を編集`}
                        className={`flex-1 min-w-0 min-h-11 flex items-center text-left text-xs break-words rounded-lg px-1 ${
                          task.completed
                            ? 'line-through text-neutral-400 dark:text-neutral-500'
                            : 'text-neutral-800 dark:text-neutral-200 font-medium'
                        }`}
                      >
                        {task.text}
                      </button>
                    )}
"""
          if 'data-testid="task-edit-trigger"' not in text:
              if old_text not in text:
                  raise SystemExit('Task text render anchor not found')
              text = text.replace(old_text, new_text, 1)

          menu_anchor = '                    <div className="relative">\n                      <button\n                        id={`task-more-btn-${task.id}`}\n'
          menu_replacement = '                    <div className="relative" data-task-menu-container={task.id}>\n                      <button\n                        id={`task-more-btn-${task.id}`}\n'
          if 'data-task-menu-container={task.id}' not in text:
              if menu_anchor not in text:
                  raise SystemExit('Task menu container anchor not found')
              text = text.replace(menu_anchor, menu_replacement, 1)

          editor.write_text(text)

          qa = Path('.github/workflows/home-task-safety-regression.yml')
          q = qa.read_text()
          q = q.replace(
              '      - name: Verify top create action, full note list, and safe task deletion',
              '      - name: Verify top create action, task editing, menu dismissal, and safe deletion',
              1,
          )

          old_qa = """          const taskMore = page.locator('[id^=\"task-more-btn-\"]').first();
          fail(await taskMore.count() !== 1, 'Task does not have a safe More menu');
          fail(await page.locator('[id^=\"task-delete-btn-\"]').count() !== 0, 'Delete action is exposed before opening the task menu');
          await taskMore.click();
          const deleteButton = page.locator('[id^=\"task-delete-btn-\"]').first();
          fail(await deleteButton.count() !== 1, 'Task delete action is not inside the More menu');
          await page.screenshot({ path: 'home-task-artifacts/task-delete-menu.png', fullPage: true });

          let dialogSeen = false;
"""
          new_qa = """          const taskEditTrigger = page.locator('[data-testid=\"task-edit-trigger\"]').first();
          fail(await taskEditTrigger.count() !== 1, 'Task text is not tappable for editing');
          await taskEditTrigger.click();
          const taskEditInput = page.locator('[data-testid=\"task-edit-input\"]').first();
          fail(await taskEditInput.count() !== 1, 'Tapping task text did not open inline editing');
          await taskEditInput.fill('編集後のタスク');
          await taskEditInput.press('Enter');
          await page.waitForTimeout(100);
          fail(!(await page.getByText('編集後のタスク', { exact: true }).count()), 'Edited task text was not saved');

          const taskMore = page.locator('[id^=\"task-more-btn-\"]').first();
          fail(await taskMore.count() !== 1, 'Task does not have a safe More menu');
          fail(await page.locator('[id^=\"task-delete-btn-\"]').count() !== 0, 'Delete action is exposed before opening the task menu');
          await taskMore.click();
          let deleteButton = page.locator('[id^=\"task-delete-btn-\"]').first();
          fail(await deleteButton.count() !== 1, 'Task delete action is not inside the More menu');
          await page.locator('#note-title-input').click();
          await page.waitForTimeout(50);
          fail(await page.locator('[id^=\"task-delete-btn-\"]').count() !== 0, 'Task delete menu stayed open after tapping elsewhere');

          await taskMore.click();
          deleteButton = page.locator('[id^=\"task-delete-btn-\"]').first();
          fail(await deleteButton.count() !== 1, 'Task delete menu did not reopen');
          await page.screenshot({ path: 'home-task-artifacts/task-delete-menu.png', fullPage: true });

          let dialogSeen = false;
"""
          if "Task text is not tappable for editing" not in q:
              if old_qa not in q:
                  raise SystemExit('Task QA anchor not found')
              q = q.replace(old_qa, new_qa, 1)

          q = q.replace(
              "fail(!(await page.getByText('消してはいけないテスト', { exact: true }).count()), 'Task was deleted even after cancelling confirmation');",
              "fail(!(await page.getByText('編集後のタスク', { exact: true }).count()), 'Task was deleted even after cancelling confirmation');",
              1,
          )
          q = q.replace(
              "fail(!!(await page.getByText('消してはいけないテスト', { exact: true }).count()), 'Task remained after explicit confirmed deletion');",
              "fail(!!(await page.getByText('編集後のタスク', { exact: true }).count()), 'Task remained after explicit confirmed deletion');",
              1,
          )
          source_anchor = "          fail(source.includes('onClick={() => handleDeleteTask(task.id)}'), 'Immediate one-tap task delete handler still exists');\n"
          source_insert = source_anchor + "          fail(!source.includes(\"document.addEventListener('pointerdown', handlePointerDown)\"), 'Outside-tap task menu dismissal handler is missing');\n          fail(!source.includes('data-testid=\"task-edit-input\"'), 'Inline task edit control is missing');\n"
          if "Outside-tap task menu dismissal handler is missing" not in q:
              if source_anchor not in q:
                  raise SystemExit('Source assertion anchor not found')
              q = q.replace(source_anchor, source_insert, 1)
          qa.write_text(q)
          PY

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/NoteEditor.tsx .github/workflows/home-task-safety-regression.yml
          git commit -m "feat: edit tasks and dismiss task menu on outside tap"
          git push origin HEAD:fix/task-edit-dismiss-menu-20260908
