name: Bootstrap encrypted cloud sync

on:
  push:
    branches:
      - feature/encrypted-cloud-sync-20260905
    paths:
      - scripts/apply_cloud_sync_app_patch.py
      - .github/workflows/encrypted-sync-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply integration patch
        run: python3 scripts/apply_cloud_sync_app_patch.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Production build
        run: bun run build
      - name: Worker syntax check
        run: node --check worker/index.js
      - name: Commit validated source integration
        run: |
          set -euo pipefail
          if git diff --quiet -- src/App.tsx src/services/storage.ts; then
            echo 'No source integration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/services/storage.ts
          git commit -m 'feat: integrate encrypted Cloudflare cloud sync'
          git push origin HEAD:${GITHUB_REF_NAME}

# Final temporary validation pass; this workflow is removed before merging to main.
