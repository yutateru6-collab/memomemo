name: Apply home raw content preview fix

on:
  push:
    branches:
      - fix/home-raw-content-preview-20260906

permissions:
  contents: write

jobs:
  patch-and-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Patch home memo preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/NoteList.tsx')
          s = p.read_text()

          old = """  const cleanSnippet = (content: string) => {\n    return content\n      .replace(/^#+\\s+/gm, '')\n      .replace(/[*_`~[\\]]/g, '')\n      .replace(/<!--[\\s\\S]*?-->/g, '')\n      .trim()\n      .split('\\n')\n      .find((line) => line.trim().length > 0) || '追加のテキストなし';\n  };\n\n"""
          if old not in s:
              raise SystemExit('cleanSnippet block not found')
          s = s.replace(old, '', 1)

          old = """          <p className=\"text-sm text-neutral-500 dark:text-neutral-400 line-clamp-2 mt-1 leading-relaxed\">\n            {cleanSnippet(note.content)}\n          </p>"""
          new = """          <p\n            data-note-content-preview=\"true\"\n            className=\"text-sm text-neutral-500 dark:text-neutral-400 line-clamp-4 mt-1 leading-relaxed whitespace-pre-wrap break-words\"\n          >\n            {note.content || '追加のテキストなし'}\n          </p>"""
          if old not in s:
              raise SystemExit('preview paragraph not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start app
        run: |
          bun run dev > /tmp/memomemo-preview-qa.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/memomemo-preview-qa.log
          exit 1

      - name: Verify raw multiline preview and truncation
        run: |
          mkdir -p home-preview-artifacts
          cat > home-preview-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
          const page = await context.newPage();
          await page.route('http://127.0.0.1:3000/api/sync', async route => route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ success: true, entries: [] }) }));
          await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' });
          await page.click('[data-testid="create-new-note-top-btn"]');
          await page.fill('#note-title-input', 'RAW PREVIEW QA');
          const body = '# 見出しそのまま\n**太字記号もそのまま**\n3行目の本文\n4行目の本文\n5行目は途中で隠れる確認\n6行目';
          await page.fill('#note-content-textarea', body);
          await page.click('#editor-back-btn');
          await page.waitForSelector('#note-list-container');
          const card = page.locator('[data-note-card="true"]', { hasText: 'RAW PREVIEW QA' });
          const preview = card.locator('[data-note-content-preview="true"]');
          const text = await preview.textContent();
          if (text !== body) throw new Error(`Home preview changed memo content: ${JSON.stringify(text)}`);
          const styles = await preview.evaluate(el => ({ whiteSpace: getComputedStyle(el).whiteSpace, webkitLineClamp: getComputedStyle(el).webkitLineClamp }));
          if (styles.whiteSpace !== 'pre-wrap') throw new Error(`Expected pre-wrap, got ${styles.whiteSpace}`);
          if (styles.webkitLineClamp !== '4') throw new Error(`Expected 4-line clamp, got ${styles.webkitLineClamp}`);
          await page.screenshot({ path: 'home-preview-artifacts/home-raw-preview.png', fullPage: true });
          fs.writeFileSync('home-preview-artifacts/result.json', JSON.stringify({ textMatches: true, styles }, null, 2));
          await browser.close();
          EOF
          node home-preview-qa.mjs

      - name: Commit app fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/NoteList.tsx
          git commit -m "Show raw memo content in home previews"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-raw-preview-qa
          path: home-preview-artifacts/
