name: Run welcome sample retirement

on:
  push:
    branches:
      - fix/remove-welcome-sample-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python3 scripts/retire_welcome_sample.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/storage.ts src/services/cloudflareSync.ts src/services/retiredSamples.ts
          git commit -m "Retire pinned welcome sample note"
          git push origin HEAD:${GITHUB_REF_NAME}
