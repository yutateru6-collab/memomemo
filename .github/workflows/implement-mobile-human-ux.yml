name: Apply audited mobile UX remediation

on:
  push:
    branches:
      - fix/mobile-human-ux-20260905

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted mobile UX changes
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_mobile_ux.py
          python3 /tmp/apply_mobile_ux.py

      - name: Remove one-shot implementation workflow
        run: rm .github/workflows/implement-mobile-human-ux.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve mobile editor usability and save flow"
          git push origin HEAD:${GITHUB_REF_NAME}
