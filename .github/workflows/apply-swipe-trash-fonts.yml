name: Apply swipe trash and typography

on:
  push:
    branches:
      - feature/swipe-trash-1h-fonts-20260906

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply implementation
        run: python3 scripts/apply_swipe_trash_fonts.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/services/noteValidation.ts src/services/trash.ts src/components/TrashModal.tsx src/App.tsx src/components/NoteEditor.tsx src/components/NoteList.tsx src/index.css
          git commit -m "Add swipe trash with one-hour retention and larger type"
          git push origin HEAD:${GITHUB_REF_NAME}
