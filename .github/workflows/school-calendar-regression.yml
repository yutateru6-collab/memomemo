name: School Memo and Calendar Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  school-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start app
        run: |
          bun run dev > /tmp/memomemo-school-calendar-qa.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/memomemo-school-calendar-qa.log
          exit 1

      - name: Verify school lesson persistence, encrypted sync, calendar, and later memo append editing
        run: |
          mkdir -p school-calendar-qa-artifacts
          cat > school-calendar-regression.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const cloudEntries = new Map();
          const failures = [];
          const fail = (condition, message) => { if (condition) failures.push(message); };

          const installCloudRoute = async (context) => {
            await context.route('**/api/sync', async (route) => {
              const body = route.request().postDataJSON();
              for (const entry of Array.isArray(body?.entries) ? body.entries : []) {
                const current = cloudEntries.get(entry.key);
                const newer = !current || entry.version > current.version || (entry.version === current.version && entry.updatedAt >= current.updatedAt);
                if (newer) cloudEntries.set(entry.key, entry);
              }
              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ success: true, entries: Array.from(cloudEntries.values()) }),
              });
            });
          };

          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 3,
            isMobile: true,
            hasTouch: true,
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1',
          });
          await installCloudRoute(context);
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' });
          const mainNav = page.locator('nav[aria-label="メインナビゲーション"]');
          await mainNav.getByRole('button', { name: '学校', exact: true }).click();
          await page.getByRole('heading', { name: '学校メモ' }).waitFor();

          await page.locator('[data-school-class="2-9"]').click();
          fail((await page.locator('[data-school-class="2-9"]').getAttribute('aria-pressed')) !== 'true', '2-9 class tab did not become active');

          await page.locator('[data-testid="school-exam-scope"]').fill('QA試験範囲：時制①〜②');
          await page.getByRole('button', { name: '試験範囲を保存', exact: true }).click();
          await page.locator('[data-testid="school-save-message"]').waitFor();

          const lessonDate = await page.locator('[data-testid="school-lesson-date"]').inputValue();
          fail(!/^\d{4}-\d{2}-\d{2}$/.test(lessonDate), `Lesson date is invalid: ${lessonDate}`);
          await page.locator('[data-testid="school-lesson-content"]').fill('QA 時制② 現在完了');
          await page.locator('[data-testid="school-lesson-flow"]').fill('前回復習 → 解説 → 例題 → 演習');
          await page.locator('[data-testid="school-handouts"]').fill('QA 時制②プリント');
          await page.locator('[data-testid="school-opening-quiz"]').fill('QA 単語730〜750');
          await page.locator('[data-testid="school-next-lesson"]').fill('QA Workbook Exercise 3');
          await page.locator('[data-testid="school-exam-snapshot"]').fill('QA 試験範囲スナップショット');
          await page.locator('[data-testid="save-school-lesson"]').click();
          await page.getByText('授業メモを保存しました', { exact: true }).waitFor();
          await page.waitForFunction(() => document.querySelector('[data-testid="school-cloud-status"]')?.textContent?.includes('同期済み'));

          const history = page.locator('[data-school-lesson-id]').filter({ hasText: 'QA 時制② 現在完了' });
          fail(await history.count() !== 1, 'Saved 2-9 school lesson did not appear exactly once in history');
          fail(!(await history.textContent())?.includes('QA Workbook Exercise 3'), 'Next lesson was not retained in history');
          fail(cloudEntries.size < 2, `School data did not reach encrypted cloud transport; entries=${cloudEntries.size}`);
          const syncConfig = await page.evaluate(() => localStorage.getItem('ios_notes_cloudflare_config'));
          fail(!syncConfig, 'Cloud sync config was not available for second-device check');
          await page.screenshot({ path: 'school-calendar-qa-artifacts/school-2-9-saved.png', fullPage: true });

          await mainNav.getByRole('button', { name: 'カレンダー', exact: true }).click();
          await page.getByRole('heading', { name: 'カレンダー' }).waitFor();
          const calendarEvent = page.locator('[data-calendar-event^="school-"]').filter({ hasText: '2-9 授業' }).filter({ hasText: 'QA 時制② 現在完了' });
          fail(await calendarEvent.count() !== 1, 'Saved school lesson did not appear on the calendar for 2-9');
          await page.screenshot({ path: 'school-calendar-qa-artifacts/calendar-2-9-event.png', fullPage: true });

          if (await calendarEvent.count()) {
            await calendarEvent.getByRole('button', { name: '学校メモを開く', exact: true }).click();
            await page.getByRole('heading', { name: '学校メモ' }).waitFor();
            fail((await page.locator('[data-school-class="2-9"]').getAttribute('aria-pressed')) !== 'true', 'Calendar event did not reopen the correct 2-9 class');
          }

          // Simulate a second device: empty local storage/IndexedDB but the exact same encrypted sync code.
          if (syncConfig) {
            const context2 = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            await installCloudRoute(context2);
            await context2.addInitScript((savedConfig) => {
              if (savedConfig) localStorage.setItem('ios_notes_cloudflare_config', savedConfig);
            }, syncConfig);
            const page2 = await context2.newPage();
            await page2.goto('http://127.0.0.1:3000', { waitUntil: 'networkidle' });
            await page2.locator('nav[aria-label="メインナビゲーション"]').getByRole('button', { name: '学校', exact: true }).click();
            await page2.getByRole('heading', { name: '学校メモ' }).waitFor();
            await page2.locator('[data-school-class="2-9"]').click();
            await page2.waitForFunction(() => document.querySelector('[data-testid="school-cloud-status"]')?.textContent?.includes('同期済み'));
            fail((await page2.locator('[data-testid="school-exam-scope"]').inputValue()) !== 'QA試験範囲：時制①〜②', 'Second device did not restore 2-9 exam scope from Cloudflare sync');
            fail(await page2.locator('[data-school-lesson-id]').filter({ hasText: 'QA 時制② 現在完了' }).count() !== 1, 'Second device did not restore the 2-9 lesson from Cloudflare sync');
            await page2.screenshot({ path: 'school-calendar-qa-artifacts/school-restored-on-second-device.png', fullPage: true });
            await context2.close();
          }

          // Normal memo regression: save once, reopen later, append text, save again,
          // reload the whole app, and prove both the original and appended text remain.
          await mainNav.getByRole('button', { name: 'メモ', exact: true }).click();
          await page.getByRole('heading', { name: 'メモ', exact: true }).waitFor();
          await page.locator('[data-testid="create-new-note-top-btn"]').click();
          await page.locator('#note-title-input').fill('QA 追記メモ');
          await page.locator('#note-content-textarea').fill('最初に保存した文');
          await page.locator('#editor-back-btn').click();
          await page.getByRole('heading', { name: 'メモ', exact: true }).waitFor();

          const memoCard = page.locator('[data-note-card="true"]').filter({ hasText: 'QA 追記メモ' });
          fail(await memoCard.count() !== 1, 'Saved normal memo did not appear exactly once');
          await memoCard.click();
          const memoBody = page.locator('#note-content-textarea');
          fail((await memoBody.inputValue()) !== '最初に保存した文', 'Saved normal memo did not reopen with its original body');
          await memoBody.fill('最初に保存した文\n後から追加した文');
          await page.locator('#editor-back-btn').click();
          await page.getByRole('heading', { name: 'メモ', exact: true }).waitFor();
          await page.reload({ waitUntil: 'networkidle' });
          await page.getByRole('heading', { name: 'メモ', exact: true }).waitFor();

          const persistedMemoCard = page.locator('[data-note-card="true"]').filter({ hasText: 'QA 追記メモ' });
          fail(await persistedMemoCard.count() !== 1, 'Appended memo did not persist after full reload');
          await persistedMemoCard.click();
          const persistedBody = await page.locator('#note-content-textarea').inputValue();
          fail(!persistedBody.includes('最初に保存した文') || !persistedBody.includes('後から追加した文'), 'Later memo append did not preserve both old and new text');
          await page.screenshot({ path: 'school-calendar-qa-artifacts/memo-append-persisted.png', fullPage: true });

          fs.writeFileSync('school-calendar-qa-artifacts/findings.json', JSON.stringify({ failures, lessonDate, cloudEntryCount: cloudEntries.size, persistedBody }, null, 2));
          console.log(JSON.stringify({ failures, lessonDate, cloudEntryCount: cloudEntries.size, persistedBody }, null, 2));
          await browser.close();
          if (failures.length) process.exit(1);
          EOF
          node school-calendar-regression.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-calendar-regression
          path: school-calendar-qa-artifacts/
